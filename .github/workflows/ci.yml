name: CPU correctness and packaging
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.8.22
      - run: uv sync --frozen --group bench
      - run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src/prefixfold
      - run: uv run --frozen pytest -q
      - run: uv run --frozen prefixfold demo
      - run: uv run --frozen python scripts/check_docs.py
      - run: uv run --frozen python scripts/audit.py
      - run: uv run --frozen python -m build && uv run --frozen twine check dist/*
  container:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t prefixfold:ci .
      - run: docker run --rm prefixfold:ci
