[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "prefixfold"
version = "0.1.0"
description = "Exact shared-prefix decode attention on CPU / CPU 共享前缀精确解码注意力"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Xu Yixian"}]
keywords = ["attention", "cpu", "kv-cache", "shared-prefix", "reproducibility"]
dependencies = ["numpy==2.2.6"]

[project.scripts]
prefixfold = "prefixfold.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.1", "mypy==1.18.2", "build==1.3.0", "twine==6.2.0", "pyyaml==6.0.2"]
bench = ["torch==2.8.0", "threadpoolctl==3.6.0", "matplotlib==3.10.6"]

[tool.uv]
required-version = "==0.8.22"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]

[tool.hatch.build.targets.wheel]
packages = ["src/prefixfold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: CLI and complete workflow tests / 命令行和完整流程测试"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/prefixfold"]
